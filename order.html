    <div class="order-page">

        <h1>Place Your Order</h1>
        <p>Your favourite drinks, just a click away!</p>

        <form class="order-form">
            <h2>Customer Details</h2>

            <label>Full Name:</label>
            <input type="text" name="fullname">

            <label>Phone Number:</label>
            <input type="text" name="phone">

            <label>Email:</label>
            <input type="email" name="email">

            <h2>Order Details</h2>
            <select name="drink">
                <option>StrawBerry Bliss</option>
                <option>Blueberry Delight</option>
                <option>Mango Lassi</option>
                <option>Matcha Magic</option>
                <option>Matcha Latte</option>
                <option>Matcha Frappe</option>
                <option>Iced Coffee</option>
                <option>Lemonade</option>
                <option>Fruit Punch</option>
            </select>

            <h3>Select Size:</h3>
            <input type="radio" name="size" value="Small"> Small
            <input type="radio" name="size" value="Medium"> Medium
            <input type="radio" name="size" value="Large"> Large


            <h2>Order Type</h2>

            <input type="radio" name="order-type" value="Pickup"> Pickup
            <input type="radio" name="order-type" value="Delivery"> Delivery


            <label>Delivery Address:</label>
            <textarea name="address" rows="3"></textarea>


            <h2>Payment Method</h2>

            <input type="radio" name="payment" value="Cash"> Cash
            <input type="radio" name="payment" value="Bank Transfer"> Bank Transfer


            <br>

            <button type="submit">Place Order</button>
        </form>
    </div>

    </body>
